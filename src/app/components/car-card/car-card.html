<div class="auto-card">
  <button class="fav" [class.active]="isFavorite" (click)="toggleFavorite()"
          [attr.aria-label]="isFavorite ? 'Remove from favorites' : 'Add to favorites'">
    <fa-icon [icon]="faHeart"></fa-icon>
  </button>

  <img [src]="'images/' + car.photo" [alt]="car.brand + ' ' + car.model">
  <div class="details">
    <h3>{{ car.brand }} {{ car.model }}</h3>
    <p>
      Power: {{ car.power }} <br>
      Price: {{ car.price }} DNT <br>
      Only {{ car.availability }} left in stock
    </p>
  </div>
  <div class="see-more">
    <button (click)="select()">see more...</button>
  </div>
</div>
